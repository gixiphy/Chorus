name: Chorus
options:
  bundleIdPrefix: com.hermes
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  ChorusCore:
    path: Packages/ChorusCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2ENEDJHX95

targets:
  # BV 虛擬音訊輸出（HAL AudioServerPlugIn）。隨 App 一起建置、內嵌在
  # Contents/PlugIns；設定頁一鍵安裝時從那裡複製到 /Library/Audio/Plug-Ins/HAL。
  ChorusAudioDevice:
    type: bundle
    platform: macOS
    sources: [AudioDriver/Source]
    settings:
      base:
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: AudioDriver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes.ChorusAudioDevice
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - AudioDriver/Source
          - AudioDriver/Source/PublicUtility
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreServices.framework
      - sdk: IOKit.framework

  # B4-3 的 chorus CLI。隨 App 建置、內嵌在 Contents/SharedSupport；
  # 設定頁提供「安裝到 /usr/local/bin」（symlink，不需要 admin）。
  #
  # target 名刻意不叫 chorus：macOS 檔案系統不分大小寫，與 app target
  # 「Chorus」只差大小寫會讓 xcodegen 把 CLI 的原始檔也編進 app target。
  # 產出的執行檔名靠 PRODUCT_NAME 指定。
  ChorusCLI:
    type: tool
    platform: macOS
    sources: [CLI]
    settings:
      base:
        # 執行檔叫 chorus，但**模組名必須另取**：兩者同在 Products/Debug，
        # chorus.swiftmodule 會在不分大小寫的檔案系統上蓋掉 app 的
        # Chorus.swiftmodule，測試的 @testable import Chorus 就解析不到。
        PRODUCT_NAME: chorus
        PRODUCT_MODULE_NAME: ChorusCLI
        SWIFT_VERSION: "6.0"
    dependencies:
      - package: ChorusCore

  Chorus:
    type: application
    platform: macOS
    sources: [Chorus]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Chorus/Support/Chorus-Bridging-Header.h
    dependencies:
      - package: ChorusCore
      - sdk: CoreDisplay.framework
      - target: ChorusAudioDevice
        embed: true
        copy:
          destination: plugins
      # 放 SharedSupport 而**不是** MacOS：macOS 檔案系統不分大小寫，
      # Contents/MacOS/chorus 與 app 自己的 Contents/MacOS/Chorus 是同一個
      # 檔案——CLI 會直接把 app 執行檔覆蓋掉，啟動 App 變成跑 CLI。
      - target: ChorusCLI
        embed: true
        copy:
          destination: sharedSupport
    info:
      path: Chorus/Support/Info.plist
      properties:
        CFBundleDisplayName: Chorus
        CFBundleIconFile: Chorus
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "40"
        LSUIElement: true
        NSLocalNetworkUsageDescription: Chorus 會在區域網路上尋找你的其他 Mac，以同步亮度與音量。
        # 系統音訊擷取（CoreAudio process taps，B6）。這個 key 不在 Xcode 的
        # 下拉清單裡，是 kTCCServiceAudioCapture 的專屬 usage key；
        # 對話框在 AudioDeviceStart 時觸發（不是建 tap 時）。
        NSAudioCaptureUsageDescription: Chorus 需要擷取系統音訊，才能提供各 App 獨立音量與等化器。音訊只在本機處理，不會傳送到任何地方。
        NSBonjourServices:
          - _chorus._tcp
          - _chorus-pair._tcp
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Chorus/Support/Chorus.entitlements
      properties:
        com.apple.security.app-sandbox: false

  ChorusAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ChorusAppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Chorus

schemes:
  Chorus:
    build:
      targets:
        Chorus: all
    run:
      config: Debug
    test:
      targets:
        - ChorusAppTests
