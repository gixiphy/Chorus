name: Chorus
options:
  bundleIdPrefix: com.hermes
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  ChorusCore:
    path: Packages/ChorusCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2ENEDJHX95

targets:
  # BV 虛擬音訊輸出（HAL AudioServerPlugIn）。隨 App 一起建置、內嵌在
  # Contents/PlugIns；設定頁一鍵安裝時從那裡複製到 /Library/Audio/Plug-Ins/HAL。
  ChorusAudioDevice:
    type: bundle
    platform: macOS
    sources: [AudioDriver/Source]
    settings:
      base:
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: AudioDriver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.hermes.ChorusAudioDevice
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - AudioDriver/Source
          - AudioDriver/Source/PublicUtility
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreServices.framework
      - sdk: IOKit.framework

  Chorus:
    type: application
    platform: macOS
    sources: [Chorus]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Chorus/Support/Chorus-Bridging-Header.h
    dependencies:
      - package: ChorusCore
      - sdk: CoreDisplay.framework
      - target: ChorusAudioDevice
        embed: true
        copy:
          destination: plugins
    info:
      path: Chorus/Support/Info.plist
      properties:
        CFBundleDisplayName: Chorus
        CFBundleIconFile: Chorus
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "19"
        LSUIElement: true
        NSLocalNetworkUsageDescription: Chorus 會在區域網路上尋找你的其他 Mac，以同步亮度與音量。
        NSBonjourServices:
          - _chorus._tcp
          - _chorus-pair._tcp
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Chorus/Support/Chorus.entitlements
      properties:
        com.apple.security.app-sandbox: false

  ChorusAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ChorusAppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Chorus

schemes:
  Chorus:
    build:
      targets:
        Chorus: all
    run:
      config: Debug
    test:
      targets:
        - ChorusAppTests
